name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install package and tools
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Build package
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Assert tag matches package version
        id: ver
        run: |
          version="$(python -c '
          import email
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("sony_cisip2-*.whl"))
          with ZipFile(wheel) as zf:
              meta_name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              msg = email.message_from_bytes(zf.read(meta_name))
          print(msg["Version"])
          ')"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          python <<'PY'
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          header = f"## [{version}]"
          start = text.find(header)
          if start < 0:
              body = f"Release {version}"
          else:
              rest = text[start + len(header) :]
              # Skip optional date suffix on the header line
              nl = rest.find("\n")
              rest = rest[nl + 1 :] if nl >= 0 else rest
              end = rest.find("\n## [")
              body = (rest if end < 0 else rest[:end]).strip() or f"Release {version}"
          Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          PY
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: false
